name: CoolBeans
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  CoolBeans:
    type: application
    platform: iOS
    sources: [CoolBeans]
    info:
      path: CoolBeans/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.CoolBeans
      SWIFT_VERSION: "5.0"
